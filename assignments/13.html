<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather City Portal</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#1f4037,#99f2c8,#134e5e);
    overflow:hidden;
}

/* Animated background circles */

.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,0.12);
    animation:float 7s infinite ease-in-out;
}

.circle:nth-child(1){
    width:140px;
    height:140px;
    top:8%;
    left:10%;
}

.circle:nth-child(2){
    width:220px;
    height:220px;
    bottom:8%;
    right:10%;
    animation-duration:9s;
}

.circle:nth-child(3){
    width:100px;
    height:100px;
    top:50%;
    left:5%;
    animation-duration:6s;
}

@keyframes float{
    0%{transform:translateY(0px);}
    50%{transform:translateY(-25px);}
    100%{transform:translateY(0px);}
}

.container{
    position:relative;
    width:430px;
    padding:40px;
    border-radius:24px;
    text-align:center;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(14px);
    box-shadow:0 0 35px rgba(0,0,0,0.4);
    z-index:1;
}

h1{
    color:white;
    margin-bottom:12px;
    font-size:38px;
    font-weight:700;
    letter-spacing:1px;
}

p{
    color:#f1f1f1;
    margin-bottom:30px;
    font-size:15px;
}

.city-link{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
    text-decoration:none;
    background:rgba(255,255,255,0.18);
    color:white;
    padding:15px;
    margin:14px 0;
    border-radius:14px;
    font-size:18px;
    font-weight:500;
    transition:0.3s;
    border:1px solid rgba(255,255,255,0.25);
}

.city-link:hover{
    transform:scale(1.05);
    background:#00b4db;
    box-shadow:0 0 18px #00b4db;
}

.footer{
    margin-top:25px;
    color:#f0f0f0;
    font-size:14px;
    opacity:0.8;
}

</style>
</head>

<body>

<div class="circle"></div>
<div class="circle"></div>
<div class="circle"></div>

<div class="container">

    <h1>🌦 Weather Portal</h1>

    <p>Select a city to check live weather conditions</p>

    <a class="city-link"
    href="https://www.google.com/search?q=bangalore+weather"
    target="_blank">
    🌤 Bangalore
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=delhi+weather"
    target="_blank">
    ☀ Delhi
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=mumbai+weather"
    target="_blank">
    🌧 Mumbai
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=chennai+weather"
    target="_blank">
    ⛅ Chennai
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=hyderabad+weather"
    target="_blank">
    🌥 Hyderabad
    </a>

    <!-- Extra Cities -->

    <a class="city-link"
    href="https://www.google.com/search?q=kolkata+weather"
    target="_blank">
    🌦 Kolkata
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=pune+weather"
    target="_blank">
    🌤 Pune
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=kochi+weather"
    target="_blank">
    🌧 Kochi
    </a>

    <a class="city-link"
    href="https://www.google.com/search?q=jaipur+weather"
    target="_blank">
    ☀ Jaipur
    </a>

    <div class="footer">
        Made with HTML + CSS 💙
    </div>

</div>

</body>
</html>
